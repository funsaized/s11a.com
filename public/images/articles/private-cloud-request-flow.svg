<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="title description">
  <title id="title">Request flow through the private development cloud</title>
  <desc id="description">A request for app.dev.example.com moves through public DNS to a Tailscale address, follows a private WireGuard route to Caddy, and ends at an application bound to loopback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#95603c" />
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2b2620" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="680" height="560" rx="18" fill="#f7f5f1" />
  <path d="M 450 117 C 548 117, 548 117, 584 117 L 584 489 C 548 489, 548 489, 450 489" fill="none" stroke="#6f7d60" stroke-width="2" stroke-dasharray="5 7" />
  <text x="603" y="304" fill="#6f7d60" font-family="Spline Sans Mono, ui-monospace, monospace" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(90 603 304)">TAILNET ONLY</text>

  <g filter="url(#shadow)">
    <rect x="70" y="28" width="410" height="72" rx="12" fill="#fdfcfa" stroke="#ddd8cf" stroke-width="2" />
    <rect x="70" y="137" width="410" height="72" rx="12" fill="#fdfcfa" stroke="#ddd8cf" stroke-width="2" />
    <rect x="70" y="246" width="410" height="72" rx="12" fill="#fdfcfa" stroke="#6f7d60" stroke-width="2" />
    <rect x="70" y="355" width="410" height="72" rx="12" fill="#fdfcfa" stroke="#6f7d60" stroke-width="2" />
    <rect x="70" y="464" width="410" height="72" rx="12" fill="#fdfcfa" stroke="#6f7d60" stroke-width="2" />
  </g>

  <g fill="#2b2620" font-family="Source Serif 4, Georgia, serif">
    <text x="94" y="59" font-size="21" font-weight="700">Readable name</text>
    <text x="94" y="83" fill="#5b554c" font-family="Spline Sans Mono, ui-monospace, monospace" font-size="15">app.dev.example.com</text>

    <text x="94" y="168" font-size="21" font-weight="700">Public DNS</text>
    <text x="450" y="168" fill="#95603c" font-family="Spline Sans Mono, ui-monospace, monospace" font-size="13" font-weight="600" text-anchor="end">PRIVATE ADDRESS</text>
    <text x="94" y="192" fill="#5b554c" font-family="Spline Sans Mono, ui-monospace, monospace" font-size="15">name → 100.64.0.0/10 address</text>

    <text x="94" y="277" font-size="21" font-weight="700">Private WireGuard route</text>
    <text x="94" y="301" fill="#5b554c" font-family="Spline Sans Mono, ui-monospace, monospace" font-size="15">identity and policy decide reachability</text>

    <text x="94" y="386" font-size="21" font-weight="700">Caddy on the Tailscale IP</text>
    <text x="94" y="410" fill="#5b554c" font-family="Spline Sans Mono, ui-monospace, monospace" font-size="15">trusted HTTPS and hostname routing</text>

    <text x="94" y="495" font-size="21" font-weight="700">Loopback application</text>
    <text x="94" y="519" fill="#5b554c" font-family="Spline Sans Mono, ui-monospace, monospace" font-size="15">127.0.0.1:8000</text>
  </g>

  <g fill="none" stroke="#95603c" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 275 103 L 275 129" />
    <path d="M 275 212 L 275 238" />
    <path d="M 275 321 L 275 347" />
    <path d="M 275 430 L 275 456" />
  </g>

  <g fill="#95603c" font-family="Spline Sans Mono, ui-monospace, monospace" font-size="13" font-weight="600">
    <text x="496" y="65">PUBLIC NAME</text>
  </g>
</svg>
