id: 9f92f1cd-cff1-43b3-b079-4adf60534f21
name: dependabot-review
description: Discover, aggregate, validate, approve, and merge open Dependabot PRs
tags: {}
concurrency: 1
inputs:
  properties: {}
jobs:
  - name: review
    steps:
      - name: discover-dependabot-prs
        task:
          type: model_method
          modelIdOrName: dependabot-prs
          methodName: sweep
      - name: require-complete-sweep
        task:
          type: assert
          expr: >-
            data.findBySpec("dependabot-prs", "sweep").filter(sweep,
              sweep.workflowRunId == run.id).size() == 1 &&
            data.findBySpec("dependabot-prs", "sweep").filter(sweep,
              sweep.workflowRunId == run.id).all(sweep,
                !sweep.attributes.truncated)
          message: Dependabot discovery must be complete before review.
          severity: high
        dependsOn:
          - step: discover-dependabot-prs
            condition:
              type: succeeded
      - name: inspect-s11a-prs
        task:
          type: model_method
          modelIdOrName: github-prs
          methodName: list
          inputs:
            repo: s11a.com
            state: open
        dependsOn:
          - step: require-complete-sweep
            condition:
              type: succeeded
      - name: resolve-exact-heads
        task:
          type: model_method
          modelIdOrName: github-merge
          methodName: inspectDependabotPrs
          inputs:
            repo: s11a.com
            pullNumbers: >-
              ${{ data.findBySpec("github-prs", "pull").filter(pr,
                pr.workflowRunId == run.id &&
                pr.attributes.user == "dependabot[bot]" &&
                pr.attributes.state == "open" &&
                !pr.attributes.draft &&
                !pr.attributes.merged &&
                pr.attributes.base == "master").map(pr, pr.attributes.number) }}
        dependsOn:
          - step: inspect-s11a-prs
            condition:
              type: succeeded
      - name: reconcile-discovery
        task:
          type: assert
          expr: >-
            data.findBySpec("github-merge", "dependabotQueue").filter(queue,
              queue.workflowRunId == run.id).size() == 1 &&
            ((data.findBySpec("dependabot-prs", "repository").filter(repo,
                repo.workflowRunId == run.id &&
                repo.attributes.repo == "s11a.com").size() == 0 &&
              data.findBySpec("github-merge", "dependabotQueue").filter(queue,
                queue.workflowRunId == run.id).all(queue,
                  queue.attributes.pullRequests.size() == 0)) ||
              (data.findBySpec("dependabot-prs", "repository").filter(repo,
                repo.workflowRunId == run.id &&
                repo.attributes.repo == "s11a.com").size() == 1 &&
                data.findBySpec("dependabot-prs", "repository").filter(repo,
                  repo.workflowRunId == run.id &&
                  repo.attributes.repo == "s11a.com").all(repo,
                    data.findBySpec("github-merge", "dependabotQueue").filter(queue,
                      queue.workflowRunId == run.id).all(queue,
                        repo.attributes.prCount == queue.attributes.pullRequests.size() &&
                        repo.attributes.prs.all(candidate,
                          queue.attributes.pullRequests.exists(pr,
                            pr.number == candidate.number))))))
          message: Dependabot sweep and exact GitHub PR inspection must agree.
          severity: high
        dependsOn:
          - step: resolve-exact-heads
            condition:
              type: succeeded
      - name: prepare-aggregate-worktree
        guard: >-
          ${{ data.findBySpec("github-merge", "dependabotQueue").filter(queue,
            queue.workflowRunId == run.id).all(queue,
              queue.attributes.pullRequests.size() == 0) }}
        task:
          type: model_method
          modelIdOrName: git-repo
          methodName: prepareDependabotWorktree
          inputs:
            pullNumbers: >-
              ${{ data.findBySpec("github-merge", "dependabotQueue").filter(queue,
                queue.workflowRunId == run.id)[0].attributes.pullRequests.map(pr,
                pr.number) }}
            expectedHeadShas: >-
              ${{ data.findBySpec("github-merge", "dependabotQueue").filter(queue,
                queue.workflowRunId == run.id)[0].attributes.pullRequests.map(pr,
                pr.head) }}
        dependsOn:
          - step: reconcile-discovery
            condition:
              type: succeeded
      - name: npm-inspect
        task:
          type: model_method
          modelIdOrName: s11a-npm
          methodName: inspect
          inputs:
            expectedGitHead: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.headSha }}
        dependsOn:
          - step: prepare-aggregate-worktree
            condition:
              type: succeeded
      - name: npm-ci
        task:
          type: model_method
          modelIdOrName: s11a-npm
          methodName: ci
          inputs:
            expectedGitHead: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.headSha }}
        dependsOn:
          - step: npm-inspect
            condition:
              type: succeeded
      - name: npm-check
        task:
          type: model_method
          modelIdOrName: s11a-npm
          methodName: run
          inputs:
            script: check
            expectedGitHead: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.headSha }}
        dependsOn:
          - step: npm-ci
            condition:
              type: succeeded
      - name: npm-build
        task:
          type: model_method
          modelIdOrName: s11a-npm
          methodName: run
          inputs:
            script: build
            expectedGitHead: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.headSha }}
        dependsOn:
          - step: npm-check
            condition:
              type: succeeded
      - name: npm-e2e
        task:
          type: model_method
          modelIdOrName: s11a-npm
          methodName: runPlaywrightE2e
          inputs:
            expectedGitHead: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.headSha }}
        dependsOn:
          - step: npm-build
            condition:
              type: succeeded
      - name: require-npm-invocations
        task:
          type: assert
          expr: >-
            data.findBySpec("s11a-npm", "invocation").filter(i,
              i.workflowRunId == run.id).size() == 4 &&
            data.findBySpec("s11a-npm", "invocation").exists(i,
              i.workflowRunId == run.id && i.attributes.operation == "inspect") &&
            data.findBySpec("s11a-npm", "invocation").exists(i,
              i.workflowRunId == run.id && i.attributes.operation == "ci") &&
            data.findBySpec("s11a-npm", "invocation").filter(i,
              i.workflowRunId == run.id && i.attributes.operation == "run").size() == 2 &&
            data.findBySpec("s11a-npm", "invocation").exists(i,
              i.workflowRunId == run.id && i.attributes.argv == ["npm", "run", "check"]) &&
            data.findBySpec("s11a-npm", "invocation").exists(i,
              i.workflowRunId == run.id && i.attributes.argv == ["npm", "run", "build"]) &&
            data.findBySpec("s11a-npm", "invocation").filter(i,
              i.workflowRunId == run.id &&
              has(i.attributes.lifecyclePolicy) &&
              i.attributes.lifecyclePolicy == "deny").size() == 4
          message: Current-run npm invocation set or lifecycle policy is incomplete.
          severity: high
        dependsOn:
          - step: npm-e2e
            condition:
              type: succeeded
      - name: require-npm-integrity
        task:
          type: assert
          expr: >-
            data.findBySpec("s11a-npm", "invocation").filter(i,
              i.workflowRunId == run.id).all(i,
              i.attributes.executionStatus == "succeeded" &&
              i.attributes.expectedGitHead ==
                data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                  worktree.workflowRunId == run.id)[0].attributes.headSha &&
              i.attributes.gitHeadBefore ==
                data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                  worktree.workflowRunId == run.id)[0].attributes.headSha &&
              i.attributes.gitHeadAfter ==
                data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                  worktree.workflowRunId == run.id)[0].attributes.headSha &&
              i.attributes.packageJsonSha256Before == i.attributes.packageJsonSha256After &&
              i.attributes.lockfileSha256Before == i.attributes.lockfileSha256After &&
              i.attributes.cleanWorktreeBefore == true &&
              i.attributes.cleanWorktreeAfter == true)
          message: Current-run npm evidence does not match the clean aggregate SHA.
          severity: high
        dependsOn:
          - step: require-npm-invocations
            condition:
              type: succeeded
      - name: require-e2e-evidence
        task:
          type: assert
          expr: >-
            data.findBySpec("s11a-npm", "playwrightLog").filter(log,
              log.workflowRunId == run.id &&
              log.attributes.executionStatus == "succeeded" &&
              log.attributes.expectedGitHead ==
                data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                  worktree.workflowRunId == run.id)[0].attributes.headSha &&
              log.attributes.gitHeadBefore == log.attributes.expectedGitHead &&
              log.attributes.gitHeadAfter == log.attributes.expectedGitHead &&
              log.attributes.cleanWorktreeAfter == true).size() == 1
          message: Current-run E2E evidence does not match the clean aggregate SHA.
          severity: high
        dependsOn:
          - step: require-npm-integrity
            condition:
              type: succeeded
      - name: inspect-aggregate-diff
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: dependabot-aggregate-diff
          methodName: diff
          globalArgs:
            repoPath: .worktrees/dependabot-review
            remote: origin
          inputs:
            base: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.baseSha }}
            head: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.headSha }}
        dependsOn:
          - step: require-e2e-evidence
            condition:
              type: succeeded
      - name: approve-aggregate
        task:
          type: manual_approval
          prompt: >-
            Review the discovered PR titles, release notes, and aggregate diff.
            Approve only if every update is safe to merge together.
          timeout: 86400
        dependsOn:
          - step: inspect-aggregate-diff
            condition:
              type: succeeded
      - name: validate-pr-heads
        task:
          type: model_method
          modelIdOrName: github-merge
          methodName: validateDependabotPrs
          inputs:
            repo: s11a.com
            baseSha: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.baseSha }}
            pullRequests: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.pullRequests.map(pr,
                {"number": pr.number, "head": pr.head}) }}
        dependsOn:
          - step: approve-aggregate
            condition:
              type: succeeded
      - name: publish-aggregate
        task:
          type: model_method
          modelIdOrName: git-repo
          methodName: publishDependabotAggregate
          inputs:
            expectedBaseSha: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.baseSha }}
            expectedHeadSha: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.headSha }}
        dependsOn:
          - step: validate-pr-heads
            condition:
              type: succeeded
      - name: close-prs
        task:
          type: model_method
          modelIdOrName: github-merge
          methodName: closeDependabotPrs
          inputs:
            repo: s11a.com
            pullRequests: >-
              ${{ data.findBySpec("git-repo", "dependabotWorktree").filter(worktree,
                worktree.workflowRunId == run.id)[0].attributes.pullRequests.map(pr,
                {"number": pr.number, "head": pr.head}) }}
        dependsOn:
          - step: publish-aggregate
            condition:
              type: succeeded
      - name: cleanup-worktree
        task:
          type: model_method
          modelIdOrName: git-repo
          methodName: removeWorktree
          inputs:
            worktreePath: .worktrees/dependabot-review
            expectedBranch: review/dependabot
        dependsOn:
          - step: close-prs
            condition:
              type: completed
    dependsOn: []
version: 1
