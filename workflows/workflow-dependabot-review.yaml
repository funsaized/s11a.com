id: 9f92f1cd-cff1-43b3-b079-4adf60534f21
name: dependabot-review
description: Validate and merge an agent-reviewed Dependabot PR at an exact SHA
tags: {}
inputs:
  properties:
    pullRequest:
      type: integer
      minimum: 1
      description: Dependabot pull request selected by the agent
    reviewedHeadSha:
      type: string
      pattern: ^[0-9a-f]{40}$
      description: Exact PR head SHA that passed CI and local browser review
    worktreePath:
      type: string
      const: .worktrees/dependabot-review
      description: Fixed clean local review worktree to remove after merge
  required:
    - pullRequest
    - reviewedHeadSha
    - worktreePath
jobs:
  - name: review
    steps:
      - name: inspect-pr
        task:
          type: model_method
          modelIdOrName: github-prs
          methodName: list
          inputs:
            repo: s11a.com
            state: open
      - name: require-safe-dependabot-pr
        task:
          type: assert
          expr: >-
            data.findBySpec("github-prs", "pull").exists(pr,
              pr.attributes.number == inputs.pullRequest &&
              pr.attributes.user == "dependabot[bot]" &&
              pr.attributes.state == "open" &&
              !pr.attributes.draft &&
              !pr.attributes.merged &&
              pr.attributes.base == "master") &&
            inputs.worktreePath == ".worktrees/dependabot-review"
          message: >-
            PR #${{ inputs.pullRequest }} must be an open, non-draft Dependabot
            PR targeting master, using the fixed review worktree.
          severity: high
        dependsOn:
          - step: inspect-pr
            condition:
              type: succeeded
      - name: npm-inspect
        task:
          type: model_method
          modelIdOrName: s11a-npm
          methodName: inspect
          inputs:
            expectedGitHead: ${{ inputs.reviewedHeadSha }}
        dependsOn:
          - step: require-safe-dependabot-pr
            condition:
              type: succeeded
      - name: npm-ci
        task:
          type: model_method
          modelIdOrName: s11a-npm
          methodName: ci
          inputs:
            expectedGitHead: ${{ inputs.reviewedHeadSha }}
        dependsOn:
          - step: npm-inspect
            condition:
              type: succeeded
      - name: npm-check
        task:
          type: model_method
          modelIdOrName: s11a-npm
          methodName: run
          inputs:
            script: check
            expectedGitHead: ${{ inputs.reviewedHeadSha }}
        dependsOn:
          - step: npm-ci
            condition:
              type: succeeded
      - name: npm-build
        task:
          type: model_method
          modelIdOrName: s11a-npm
          methodName: run
          inputs:
            script: build
            expectedGitHead: ${{ inputs.reviewedHeadSha }}
        dependsOn:
          - step: npm-check
            condition:
              type: succeeded
      - name: require-npm-evidence
        task:
          type: assert
          expr: >-
            data.findBySpec("s11a-npm", "invocation").size() == 4 &&
            data.findBySpec("s11a-npm", "invocation").exists(i,
              i.attributes.operation == "inspect") &&
            data.findBySpec("s11a-npm", "invocation").exists(i,
              i.attributes.operation == "ci") &&
            data.findBySpec("s11a-npm", "invocation").filter(i,
              i.attributes.operation == "run").size() == 2 &&
            data.findBySpec("s11a-npm", "invocation").all(i,
              i.attributes.executionStatus == "succeeded" &&
              i.attributes.expectedGitHead == inputs.reviewedHeadSha &&
              i.attributes.gitHeadBefore == inputs.reviewedHeadSha &&
              i.attributes.gitHeadAfter == inputs.reviewedHeadSha &&
              i.attributes.packageJsonSha256Before == i.attributes.packageJsonSha256After &&
              i.attributes.lockfileSha256Before == i.attributes.lockfileSha256After &&
              i.attributes.cleanWorktreeBefore == true &&
              i.attributes.cleanWorktreeAfter == true &&
              i.attributes.lifecyclePolicy == "deny")
          message: >-
            Current-run npm evidence must prove inspect, ci, check, and build
            succeeded against the reviewed SHA without manifest or Git drift.
          severity: high
        dependsOn:
          - step: npm-build
            condition:
              type: succeeded
      - name: merge-pr
        task:
          type: model_method
          modelIdOrName: github-merge
          methodName: mergeDependabotPr
          inputs:
            repo: s11a.com
            pullNumber: ${{ inputs.pullRequest }}
            expectedHeadSha: ${{ inputs.reviewedHeadSha }}
        dependsOn:
          - step: require-npm-evidence
            condition:
              type: succeeded
      - name: cleanup-worktree
        task:
          type: model_method
          modelIdOrName: git-repo
          methodName: removeWorktree
          inputs:
            worktreePath: ${{ inputs.worktreePath }}
            expectedBranch: review/pr-${{ inputs.pullRequest }}
        dependsOn:
          - step: merge-pr
            condition:
              type: succeeded
    dependsOn: []
version: 1
